<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<link rel="stylesheet" type="text/css" href="/css/tcui-styles.css">
<title>Information for a GNSS file</title>
<style type="text/css">
#upload-progress {
  display: none;
  margin-top: 1em;
  max-width: 40em;
}
#upload-progress.visible {
  display: block;
}
#upload-progress-bar {
  width: 100%;
  height: 1.25em;
  border: 1px solid #999;
  background: #eee;
}
#upload-progress-fill {
  width: 0;
  height: 100%;
  background: #0063a3;
  transition: width 0.15s linear;
}
#upload-progress-text {
  margin-top: 0.5em;
}
#upload-error {
  display: none;
  margin-top: 1em;
  color: #a00000;
}
#upload-error.visible {
  display: block;
}
#upload-processing {
  display: none;
  margin-top: 1em;
  color: #0063a3;
}
#upload-processing.visible {
  display: block;
}
#upload-results {
  display: none;
  margin-top: 1em;
  max-width: 100%;
}
#upload-results.visible {
  display: block;
}
.results-toolbar {
  margin: 0 0 8px 0;
}
#copy-results-status {
  margin-left: 8px;
  color: #0063a3;
  font-size: 13px;
}
#upload-results pre {
  max-height: 480px;
  overflow: auto;
  margin: 0;
  padding: 10px;
  border: 1px solid #ccc;
  background: #fff;
  font-family: monospace;
  font-size: 12px;
  white-space: pre-wrap;
}
</style>
</head>
<body class="page">
<div class="container clearfix">
  <div style="padding: 10px 10px 10px 0 ;"> <a href="http://construction.trimble.com/">
        <img src="/images/trimble-logo.jpg" alt="Trimble Logo" id="logo"> </a>
      </div>
</div>
<div id="top-header-trim"></div>
<div id="content-area">
<div id="content">
<div id="main-content" class="clearfix">
<form id="t02-upload-form" action="/cgi-bin/T02_Info/T02_Info.pl" method="post" enctype="multipart/form-data">
<table border="1" width="100%">
<caption>GNSS File Source</caption>
<col width="25%">
<col width="75%">
<tr>
<td>
GNSS File:
</td>
<td>
<input type="file" name="file" id="gnss-file" size="80" accept=".T01,.T02,.T04" required="required"/>
</td>
</tr>
</table>
<br/>
<input type="submit" id="t02-submit" value="Submit" />
<div id="upload-progress" aria-live="polite">
  <div id="upload-progress-bar"><div id="upload-progress-fill"></div></div>
  <div id="upload-progress-text">Uploading... 0%</div>
</div>
<div id="upload-error"></div>
<div id="upload-processing">Processing your file on the server. This may take a minute for large files.</div>
<div id="upload-results">
  <div class="results-toolbar">
    <button type="button" id="copy-results">Copy results</button>
    <span id="copy-results-status" aria-live="polite"></span>
  </div>
  <pre id="results-pre"></pre>
</div>
</form>
</div>
</div>
</div>
<script type="text/javascript">
(function () {
  var form = document.getElementById("t02-upload-form");
  var fileInput = document.getElementById("gnss-file");
  var submitButton = document.getElementById("t02-submit");
  var progressBox = document.getElementById("upload-progress");
  var progressFill = document.getElementById("upload-progress-fill");
  var progressText = document.getElementById("upload-progress-text");
  var errorBox = document.getElementById("upload-error");
  var processingBox = document.getElementById("upload-processing");
  var resultsBox = document.getElementById("upload-results");
  var resultsPre = document.getElementById("results-pre");
  var copyButton = document.getElementById("copy-results");
  var copyStatus = document.getElementById("copy-results-status");

  function formatBytes(bytes) {
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
    return (bytes / (1024 * 1024)).toFixed(1) + " MB";
  }

  function setProgress(loaded, total) {
    var percent = total ? Math.round((loaded / total) * 100) : 0;
    progressFill.style.width = percent + "%";
    if (total) {
      progressText.textContent =
        "Uploading... " + percent + "% (" + formatBytes(loaded) + " of " + formatBytes(total) + ")";
    } else {
      progressText.textContent = "Uploading... " + formatBytes(loaded) + " sent";
    }
  }

  function showError(message) {
    errorBox.textContent = message;
    errorBox.className = "visible";
  }

  function clearStatus() {
    errorBox.textContent = "";
    errorBox.className = "";
    processingBox.className = "";
    resultsBox.className = "";
    resultsPre.textContent = "";
    copyStatus.textContent = "";
  }

  function copyResultsToClipboard() {
    var text = resultsPre.textContent || "";
    if (!text) {
      copyStatus.textContent = "Nothing to copy.";
      return;
    }
    function onSuccess() {
      copyStatus.textContent = "Copied to clipboard.";
      window.setTimeout(function () { copyStatus.textContent = ""; }, 2000);
    }
    function onFailure() {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.select();
      try {
        if (document.execCommand("copy")) {
          onSuccess();
        } else {
          copyStatus.textContent = "Copy failed.";
        }
      } catch (ignore) {
        copyStatus.textContent = "Copy failed.";
      }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(onSuccess).catch(onFailure);
    } else {
      onFailure();
    }
  }

  copyButton.addEventListener("click", copyResultsToClipboard);

  function parseJsonError(responseText) {
    if (!responseText) return null;
    try {
      var data = JSON.parse(responseText);
      if (data && data.error) {
        return data.error;
      }
    } catch (ignore) {}
    return null;
  }

  function showRequestFailure(xhr) {
    if (xhr.status === 413 || xhr.status === 500 || xhr.status === 502 ||
        xhr.status === 504 || xhr.status === 0) {
      showError(
        "Upload was interrupted before the server received the full file" +
        (xhr.status ? " (HTTP " + xhr.status + ")." : ".") +
        " Try again on a stable connection. Large T0x files may need increased Apache upload limits on the server."
      );
      return;
    }
    var jsonError = parseJsonError(xhr.responseText || "");
    if (jsonError) {
      showError(jsonError);
      return;
    }
    var detail = (xhr.responseText || "").replace(/\s+/g, " ").trim().slice(0, 300);
    showError(
      "Upload failed (HTTP " + xhr.status + ")." +
      (detail ? " " + detail : " Please try again.")
    );
  }

  function extractPreLog(html) {
    var parts = [];
    var searchFrom = 0;
    while (true) {
      var start = html.indexOf("<pre>", searchFrom);
      if (start === -1) break;
      start += 5;
      var end = html.indexOf("</pre>", start);
      if (end === -1) {
        parts.push(html.slice(start));
        break;
      }
      parts.push(html.slice(start, end));
      searchFrom = end + 6;
    }
    return parts.join("\n");
  }

  form.addEventListener("submit", function (event) {
    event.preventDefault();
    clearStatus();

    if (!fileInput.files || !fileInput.files.length) {
      showError("Please choose a GNSS file to upload.");
      return;
    }

    var formData = new FormData(form);
    var xhr = new XMLHttpRequest();

    submitButton.disabled = true;
    progressBox.className = "visible";
    setProgress(0, fileInput.files[0].size || 0);

    xhr.upload.addEventListener("progress", function (uploadEvent) {
      if (uploadEvent.lengthComputable) {
        setProgress(uploadEvent.loaded, uploadEvent.total);
        if (uploadEvent.loaded >= uploadEvent.total) {
          progressText.textContent = "Upload complete. Waiting for server...";
        }
      } else {
        setProgress(uploadEvent.loaded, 0);
      }
    });

    xhr.addEventListener("load", function () {
      if (xhr.status === 401) {
        submitButton.disabled = false;
        progressBox.className = "";
        showError("Authentication required. Reload this page and sign in when prompted.");
        return;
      }
      if (xhr.status === 429) {
        submitButton.disabled = false;
        progressBox.className = "";
        showError("Rate limit exceeded. Wait and try again later.");
        return;
      }
      if (xhr.status >= 200 && xhr.status < 300) {
        progressText.textContent = "Upload complete.";
        progressFill.style.width = "100%";
        processingBox.className = "";

        var successJsonError = parseJsonError(xhr.responseText);
        if (successJsonError) {
          submitButton.disabled = false;
          progressBox.className = "";
          showError(successJsonError);
          return;
        }

        var logText = extractPreLog(xhr.responseText);
        if (logText) {
          resultsPre.textContent = logText;
          resultsBox.className = "visible";
        } else {
          showError("Processing finished, but no output was returned.");
        }
        submitButton.disabled = false;
        progressBox.className = "";
        return;
      }

      submitButton.disabled = false;
      progressBox.className = "";
      showRequestFailure(xhr);
    });

    xhr.addEventListener("loadstart", function () {
      processingBox.className = "visible";
    });

    xhr.addEventListener("error", function () {
      submitButton.disabled = false;
      progressBox.className = "";
      processingBox.className = "";
      showError("Upload failed due to a network error. Please try again.");
    });

    xhr.addEventListener("abort", function () {
      submitButton.disabled = false;
      progressBox.className = "";
      processingBox.className = "";
      showError("Upload cancelled.");
    });

    xhr.open("POST", form.action, true);
    xhr.setRequestHeader("X-Requested-With", "XMLHttpRequest");
    xhr.send(formData);
  });
})();
</script>
</body>
</html>
