<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<link rel="stylesheet" type="text/css" href="/css/tcui-styles.css">
<title>Plot postions for a GNSS file</title>
<style type="text/css">
  #submit-status {
    display: none;
    margin: 16px 0;
    padding: 14px;
    border: 1px solid #999;
    border-radius: 6px;
    background: #f8f8f8;
  }
  #submit-status.active {
    display: block;
  }
  #status-phase {
    font-weight: bold;
    margin: 0 0 8px 0;
  }
  .upload-progress-block {
    margin: 0 0 12px 0;
  }
  .upload-progress-block:last-of-type {
    margin-bottom: 0;
  }
  .upload-progress-label {
    margin: 0 0 4px 0;
    font-size: 13px;
    color: #333;
  }
  .progress-track {
    width: 100%;
    height: 18px;
    border: 1px solid #888;
    border-radius: 4px;
    background: #fff;
    overflow: hidden;
    margin: 8px 0 12px 0;
  }
  .progress-fill {
    height: 100%;
    width: 0;
    background: #0063a3;
    transition: width 0.15s linear;
  }
  .progress-fill.indeterminate {
    width: 35%;
    animation: gnss-progress-indeterminate 1.2s ease-in-out infinite;
  }
  @keyframes gnss-progress-indeterminate {
    0% { margin-left: 0; }
    50% { margin-left: 65%; }
    100% { margin-left: 0; }
  }
  #status-detail {
    margin: 0 0 10px 0;
    color: #333;
  }
  #processing-log {
    display: none;
    max-height: 420px;
    overflow: auto;
    margin: 0;
    padding: 10px;
    border: 1px solid #ccc;
    background: #fff;
    font-family: monospace;
    font-size: 12px;
    white-space: pre-wrap;
  }
  #processing-log.visible {
    display: block;
  }
  .form-disabled {
    opacity: 0.55;
    pointer-events: none;
  }
</style>
</head>
<body class="page">
<div class="container clearfix">
  <div style="padding: 10px 10px 10px 0 ;"> <a href="http://construction.trimble.com/">
        <img src="/images/trimble-logo.jpg" alt="Trimble Logo" id="logo"> </a>
      </div>
  <!-- end #logo-area -->
</div>
<div id="top-header-trim"></div>
<div id="content-area">
<div id="content">
<div id="main-content" class="clearfix">
<form id="gnss-plot-form" action="/cgi-bin/PositionPlot/T02_2_PNG.pl" method="post" enctype="multipart/form-data">
<table border="1" width="100%">
<caption>GNSS File Source</caption>
<col width="25%">
<col width="75%">
<tr>
<td>
GNSS File:
</td>
<td>
<input type="file" name="file" id="gnss-file" size="80" accept=".T00,.T01,.T02,.T04"/>
</td>
</tr>
<tr>
<td>
Truth file (ATS, optional):
</td>
<td>
<input type="file" name="truth_file" id="truth-file" size="80" accept=".txt,.ats,.log"/>
</td>
</tr>
</table>
<br/>
<table border="1" width="100%">
<caption>Processing options</caption>
<col width="25%">
<col width="75%">
<tr>
<td>
Solution Type:
</td>
<td>
<select name="Sol">
   <option value="-2">All (no filter)</option>
   <option value="" selected>Automatic</option>
   <option value="0">Autonomous</option>
   <option value="1">RTCM</option>
   <option value="2">SBAS</option>
   <option value="3">Float</option>
   <option value="4">Fixed</option>
   <option value="5">OmniSTAR</option>
   <option value="6">Network Fixed</option>
   <option value="7">Network Float</option>
   <option value="8">Type 8</option>
   <option value="9">Kalman Autonomous</option>
   <option value="15">RTX</option>
   <option value="41">HAS</option>
</select>
</td>
</tr>
<tr>
<td>
Mean Solution Type:
</td>
<td>
<select name="MeanSol">
   <option value="-1" selected>Automatic</option>
   <option value="all">All (no filter)</option>
   <option value="0">Autonomous</option>
   <option value="1">RTCM</option>
   <option value="2">SBAS</option>
   <option value="3">Float</option>
   <option value="4">Fixed</option>
   <option value="5">OmniSTAR</option>
   <option value="6">Network Fixed</option>
   <option value="7">Network Float</option>
   <option value="8">Type 8</option>
   <option value="9">Kalman Autonomous</option>
   <option value="15">RTX</option>
   <option value="41">HAS</option>
</select>
</td>
</tr>
<tr>
<td>
Decimate:
</td>
<td>
<select name="Decimate">
   <option value="-1">Automatic</option>
   <option selected value="0">Don't Decimate (All Data)</option>
   <option value="0.2">5Hz</option>
   <option value="1">1 Second</option>
   <option value="2">2 Second</option>
   <option value="5">5 Second</option>
   <option value="10">10 Second</option>
   <option value="15">15 Second</option>
   <option value="30">30 Second</option>
   <option value="60">60 Second</option>
</select>
</td>
</tr>
<tr>
<td>
Session type:
</td>
<td>
<select name="SessionType">
   <option value="-1" selected>Automatic</option>
   <option value="0">Static</option>
   <option value="1">Moving</option>
</select>
</td>
</tr>
<tr>
<td>
Plot axis range:
</td>
<td>
<select name="Range">
   <option selected value="0">Automatic</option>
   <option value="1">Fixed</option>
</select>
</td>
</tr>
<tr>
<td>
Project (Optional):
</td>
<td>
<input type="text" name="project" size="30"/>
</td>
</tr>


<tr>
<td>
Point Name (Optional):
</td>
<td>
<input type="text" name="Point" size="30"/>
</td>
</tr>


</table>
<p/>

<input type="checkbox" name="SaveFile" value="1" id="save-file"/>
<label for="save-file">Save raw position files</label>
<p/>

<input type="submit" id="gnss-submit" value="Submit" />
</form>

<div id="submit-status" aria-live="polite">
  <p id="status-phase">Uploading file...</p>
  <div class="upload-progress-block" id="gnss-upload-progress">
    <p class="upload-progress-label">GNSS file</p>
    <div class="progress-track" aria-hidden="true">
      <div class="progress-fill" id="gnss-progress-fill"></div>
    </div>
    <p class="upload-progress-label" id="gnss-upload-detail"></p>
  </div>
  <div class="upload-progress-block" id="ats-upload-progress" hidden>
    <p class="upload-progress-label">ATS truth file</p>
    <div class="progress-track" aria-hidden="true">
      <div class="progress-fill" id="ats-progress-fill"></div>
    </div>
    <p class="upload-progress-label" id="ats-upload-detail"></p>
  </div>
  <p id="status-detail"></p>
  <pre id="processing-log"></pre>
</div>

</div>
</div>
</div>

<script type="text/javascript">
(function () {
  var form = document.getElementById("gnss-plot-form");
  var statusPanel = document.getElementById("submit-status");
  var statusPhase = document.getElementById("status-phase");
  var statusDetail = document.getElementById("status-detail");
  var gnssProgressFill = document.getElementById("gnss-progress-fill");
  var atsProgressFill = document.getElementById("ats-progress-fill");
  var atsProgressBlock = document.getElementById("ats-upload-progress");
  var gnssUploadDetail = document.getElementById("gnss-upload-detail");
  var atsUploadDetail = document.getElementById("ats-upload-detail");
  var processingLog = document.getElementById("processing-log");
  var submitBtn = document.getElementById("gnss-submit");
  var activeXhr = null;
  var redirectScheduled = false;

  function setPhase(text) {
    statusPhase.textContent = text;
  }

  function escapeAttr(value) {
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/"/g, "&quot;")
      .replace(/</g, "&lt;");
  }

  function setDetailHtml(html) {
    statusDetail.innerHTML = html || "";
  }

  function setDetail(text) {
    statusDetail.textContent = text || "";
  }

  function setProgressFill(fillEl, percent, indeterminate) {
    if (indeterminate) {
      fillEl.className = "progress-fill indeterminate";
      fillEl.style.width = "";
      return;
    }
    fillEl.className = "progress-fill";
    fillEl.style.width = Math.min(100, Math.max(0, percent)) + "%";
  }

  function setGnssUploadPercent(percent, indeterminate) {
    setProgressFill(gnssProgressFill, percent, indeterminate);
  }

  function setAtsUploadPercent(percent, indeterminate) {
    setProgressFill(atsProgressFill, percent, indeterminate);
  }

  function resetUploadProgress() {
    setGnssUploadPercent(0, false);
    setAtsUploadPercent(0, false);
    gnssUploadDetail.textContent = "";
    atsUploadDetail.textContent = "";
    atsProgressBlock.hidden = true;
  }

  function formatBytes(bytes) {
    if (!Number.isFinite(bytes) || bytes < 0) return "0 B";
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
    if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + " MB";
    return (bytes / (1024 * 1024 * 1024)).toFixed(2) + " GB";
  }

  function updateUploadProgress(event, gnssFile, atsFile) {
    var gnssSize = gnssFile.size;
    var hasAts = !!atsFile;
    var atsSize = hasAts ? atsFile.size : 0;
    var totalSize = gnssSize + atsSize;

    if (!event.lengthComputable || totalSize <= 0) {
      setGnssUploadPercent(0, true);
      if (hasAts) {
        setAtsUploadPercent(0, true);
      }
      setDetail("Uploading to the server...");
      return;
    }

    var loaded = event.loaded;
    var gnssLoaded = Math.min(loaded, gnssSize);
    var atsLoaded = hasAts ? Math.max(0, loaded - gnssSize) : 0;
    var gnssPct = Math.round((gnssLoaded / gnssSize) * 100);
    var atsPct = hasAts && atsSize > 0 ? Math.round((atsLoaded / atsSize) * 100) : 0;
    var overallPct = Math.round((loaded / totalSize) * 100);

    setGnssUploadPercent(gnssPct, false);
    gnssUploadDetail.textContent =
      gnssFile.name + ": " + gnssPct + "% (" + formatBytes(gnssLoaded) + " / " + formatBytes(gnssSize) + ")";

    if (hasAts) {
      setAtsUploadPercent(atsPct, false);
      atsUploadDetail.textContent =
        atsFile.name + ": " + atsPct + "% (" + formatBytes(atsLoaded) + " / " + formatBytes(atsSize) + ")";
      if (gnssPct >= 100 && atsPct < 100) {
        setPhase("Uploading ATS truth file...");
      } else if (overallPct < 100) {
        setPhase("Uploading files...");
      }
      setDetail("Overall upload " + overallPct + "% complete.");
    } else {
      setPhase(gnssPct >= 100 ? "Upload complete. Processing on server..." : "Uploading GNSS file...");
      setDetail("Uploaded " + gnssPct + "% of " + gnssFile.name + ".");
    }
  }

  function isProcessingComplete(html) {
    return /Processing complete/i.test(html) ||
      /Plotting completed/i.test(html) ||
      /<a href="[^"]+">Open report<\/a>/i.test(html);
  }

  function extractReportUrl(html, requireComplete) {
    if (requireComplete && !isProcessingComplete(html)) {
      return null;
    }
    var m = html.match(/content="0;url=([^"]+)"/i);
    if (m) return m[1];
    m = html.match(/window\.location\.replace\("([^"]+)"\)/);
    if (m) return m[1];
    m = html.match(/<a href="(\/results\/[^"]+)">Open report<\/a>/i);
    if (m) return m[1];
    if (!requireComplete) {
      m = html.match(/The report will be at[^<]*<a href="([^"]+)"/i);
      if (m) return m[1];
    }
    return null;
  }

  function extractPreLog(html) {
    var parts = [];
    var searchFrom = 0;
    while (true) {
      var start = html.indexOf("<pre>", searchFrom);
      if (start === -1) {
        break;
      }
      start += 5;
      var end = html.indexOf("</pre>", start);
      if (end === -1) {
        parts.push(html.slice(start));
        break;
      }
      parts.push(html.slice(start, end));
      searchFrom = end + 6;
    }
    return parts.join("\n").replace(/<[^>]+>/g, "");
  }

  function showProcessingLog(text) {
    processingLog.className = "visible";
    processingLog.textContent = text || "";
    processingLog.scrollTop = processingLog.scrollHeight;
  }

  function waitForProcessingComplete(resultsUrl, callback) {
    var base = resultsUrl.replace(/\/?$/, "/");
    var statusUrl = base + "processing.status";
    var indexUrl = base + "index.shtml";
    var errorUrl = base + "processing_error.txt";
    var pollIntervalMs = 3000;

    function pollStatus() {
      var check = new XMLHttpRequest();
      check.open("GET", statusUrl + "?_=" + Date.now(), true);
      check.onload = function () {
        if (check.status === 200) {
          setPhase("Processing on server...");
          window.setTimeout(pollStatus, pollIntervalMs);
          return;
        }
        verifyReportReady();
      };
      check.onerror = function () {
        verifyReportReady();
      };
      check.send();
    }

    function verifyReportReady() {
      var err = new XMLHttpRequest();
      err.open("GET", errorUrl + "?_=" + Date.now(), true);
      err.onload = function () {
        if (err.status === 200 && err.responseText.trim()) {
          setPhase("Processing failed.");
          setDetail(err.responseText.trim());
          form.className = "";
          submitBtn.disabled = false;
          return;
        }
        checkIndex();
      };
      err.onerror = checkIndex;
      err.send();
    }

    function checkIndex() {
      var idx = new XMLHttpRequest();
      idx.open("HEAD", indexUrl + "?_=" + Date.now(), true);
      idx.onload = function () {
        if (idx.status >= 200 && idx.status < 400) {
          callback();
          return;
        }
        setPhase("Processing on server...");
        window.setTimeout(pollStatus, pollIntervalMs);
      };
      idx.onerror = function () {
        window.setTimeout(pollStatus, pollIntervalMs);
      };
      idx.send();
    }

    pollStatus();
  }

  function extractStatusMessages(html) {
    var bodyMatch = html.match(/<body[^>]*>([\s\S]*)/i);
    if (!bodyMatch) return "";
    var body = bodyMatch[1];
    var preIdx = body.indexOf("<pre>");
    var header = preIdx === -1 ? body : body.slice(0, preIdx);
    header = header.replace(/<h1[^>]*>[\s\S]*?<\/h1>/i, "");
    header = header.replace(/<script[\s\S]*?<\/script>/gi, "");
    header = header.replace(/<meta[^>]*>/gi, "");
    header = header.replace(/<p>\s*<\/p>/gi, "");
    return header.replace(/<br\s*\/?>/gi, "\n").replace(/<[^>]+>/g, "").trim();
  }

  function updateFromResponse(html, finished) {
    var logText = extractPreLog(html);
    var headerText = extractStatusMessages(html);
    var complete = isProcessingComplete(html);
    var reportUrl = extractReportUrl(html, finished) || extractReportUrl(html, false);

    if (reportUrl) {
      setDetailHtml(
        'The report will be at <a href="' + escapeAttr(reportUrl) + '">' +
        escapeAttr(reportUrl) + "</a>"
      );
    } else if (headerText) {
      setDetail(headerText.replace(/\n+/g, " ").trim());
    }

    if (logText) {
      showProcessingLog(logText);
    }

    if (finished && complete && reportUrl) {
      if (!redirectScheduled) {
        redirectScheduled = true;
        setPhase("Processing complete. Opening report...");
        setGnssUploadPercent(100, false);
        setAtsUploadPercent(100, false);
        window.setTimeout(function () {
          window.location.href = reportUrl;
        }, 5000);
      }
    }
  }

  function resetUi() {
    statusPanel.className = "";
    processingLog.className = "";
    processingLog.textContent = "";
    setDetail("");
    resetUploadProgress();
    form.className = "";
    submitBtn.disabled = false;
    redirectScheduled = false;
  }

  function beginSubmit() {
    var fileInput = document.getElementById("gnss-file");
    var truthInput = document.getElementById("truth-file");
    var hasFile = fileInput.files && fileInput.files.length > 0;
    var gnssFile = hasFile ? fileInput.files[0] : null;
    var atsFile = truthInput.files && truthInput.files.length > 0 ? truthInput.files[0] : null;

    if (!hasFile) {
      window.alert("Select a GNSS file to upload.");
      return;
    }

    if (activeXhr) {
      activeXhr.abort();
      activeXhr = null;
    }

    resetUi();
    form.className = "form-disabled";
    submitBtn.disabled = true;
    statusPanel.className = "active";
    atsProgressBlock.hidden = !atsFile;

    setPhase(atsFile ? "Uploading files..." : "Uploading GNSS file...");
    setDetail(
      atsFile
        ? "Sending " + gnssFile.name + " and " + atsFile.name + " to the server."
        : "Sending " + gnssFile.name + " to the server."
    );
    setGnssUploadPercent(0, false);
    if (atsFile) {
      setAtsUploadPercent(0, false);
    }

    var xhr = new XMLHttpRequest();
    activeXhr = xhr;
    var formData = new FormData(form);

    xhr.open("POST", form.action, true);
    xhr.withCredentials = true;

    xhr.upload.addEventListener("progress", function (event) {
      updateUploadProgress(event, gnssFile, atsFile);
      if (event.lengthComputable) {
        var totalSize = gnssFile.size + (atsFile ? atsFile.size : 0);
        if (totalSize > 0 && event.loaded >= totalSize) {
          setPhase("Upload complete. Processing on server...");
          setGnssUploadPercent(100, false);
          if (atsFile) {
            setAtsUploadPercent(100, false);
          }
          showProcessingLog("Waiting for processing output...");
        }
      }
    });

    xhr.addEventListener("readystatechange", function () {
      if (xhr.readyState === XMLHttpRequest.LOADING || xhr.readyState === XMLHttpRequest.DONE) {
        if (xhr.readyState === XMLHttpRequest.LOADING) {
          setPhase("Processing on server...");
          setGnssUploadPercent(100, false);
          if (atsFile) {
            setAtsUploadPercent(100, false);
          }
          showProcessingLog(processingLog.textContent || "Waiting for processing output...");
        }
        updateFromResponse(xhr.responseText, xhr.readyState === XMLHttpRequest.DONE);
      }
    });

    xhr.addEventListener("load", function () {
      activeXhr = null;
      if (xhr.status === 401) {
        setPhase("Authentication required.");
        setDetail("Reload this page and sign in when your browser prompts for GNSS Plotting credentials.");
        form.className = "";
        submitBtn.disabled = false;
        return;
      }
      if (xhr.status === 429) {
        setPhase("Rate limit exceeded.");
        setDetail("Too many plot requests from this address. Wait and try again later.");
        form.className = "";
        submitBtn.disabled = false;
        return;
      }
      if (xhr.status < 200 || xhr.status >= 300) {
        setPhase("Request failed.");
        setDetail("Server returned HTTP " + xhr.status + ".");
        form.className = "";
        submitBtn.disabled = false;
        return;
      }
      updateFromResponse(xhr.responseText, true);
      var reportUrl = extractReportUrl(xhr.responseText, false);
      if (reportUrl) {
        setPhase("Processing on server...");
        setDetailHtml(
          'Building report at <a href="' + escapeAttr(reportUrl) + '">' +
          escapeAttr(reportUrl) + "</a>. Large files may take several minutes."
        );
        waitForProcessingComplete(reportUrl, function () {
          window.location.assign(reportUrl);
        });
        return;
      }
      if (!isProcessingComplete(xhr.responseText) || !extractReportUrl(xhr.responseText, true)) {
        setPhase("Processing finished.");
        form.className = "";
        submitBtn.disabled = false;
      }
    });

    xhr.addEventListener("error", function () {
      activeXhr = null;
      setPhase("Upload or connection failed.");
      setDetail("Check your network connection and try again.");
      form.className = "";
      submitBtn.disabled = false;
    });

    xhr.addEventListener("abort", function () {
      activeXhr = null;
    });

    xhr.send(formData);
  }

  form.addEventListener("submit", function (event) {
    event.preventDefault();
    beginSubmit();
  });

  window.addEventListener("pageshow", function (event) {
    if (!event.persisted && !form.classList.contains("form-disabled")) {
      return;
    }
    if (activeXhr) {
      activeXhr.abort();
      activeXhr = null;
    }
    resetUi();
  });
})();
</script>

</body>
</html>
