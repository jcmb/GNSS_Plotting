    var Freq=getURLParameter("FREQ")

<script>

var plotAntennas = ["0"];
var plotAntenna = "0";
var plotCompareMode = false;

function create_plot(System,Freq,Signal) {
//    $("body").css("cursor", "progress");
    $("#status").text("Processing")
    if (plotCompareMode && isTripleAntennaLayout(plotAntennas)) {
        create_compare_plot(System, Freq, Signal);
        return;
    }
    var Max_SVs = 1

    if (System == "GPS") {
        Min_SVs=1;
        Max_SVs=32;
        }
    if (System == "GAL") {
        Min_SVs=1;
        Max_SVs=36;
        }

    if (System == "GLONASS") {
        Min_SVs=1;
        Max_SVs=24;
        }

    if (System == "SBAS") {
//        Max_SVs=39;
        Min_SVs=120;
        Max_SVs=158;
        }

    if (System == "BDS") {
        Min_SVs=1;
        Max_SVs=63;
        }


    var options = interactiveChartOptions({
        chart: {
            renderTo: 'container',
            type: 'scatter',
            markersize: 1,
            animation:false,
        },

        legend: {
            enabled: false
        },

        title: {
            text: 'Tracking  (' + System +  ' ' + Freq + '-' + Signal +')'
        },
        xAxis : {
            type: 'datetime',
            title: {
                text: 'GPS Time'
            }
        },
        yAxis: {
            min:Min_SVs,
            max:Max_SVs,
            endOnTick:false,
            title: {
                text: 'SV'
            }
        },
        tooltip: {
            formatter: function() {
//                console.log(this)
                return '<b>'+ this.series.name +'</b><br/>'
                 +'Elev: '+ this.point.Elev +' Az: ' +this.point.Az +' SNR: ' +this.point.SNR;
                }
        },
        plotOptions: {
            series: {
                turboThreshold: 0
                },
            scatter: {
                marker: {
                    radius: 1,
                    states: {
                        hover: {
                            enabled: true,
                            lineColor: 'rgb(100,100,100)'
                        }
                    }
                },
                states: {
                    hover: {
                        marker: {
                            enabled: false
                        }
                    }
                },
            }
        },

        });

    series_data=[];
    options.series=[]
    last_slip=[]
    last_Az=[]
    last_Elev=[]
    last_Every=[]

    for (var i=0;i<Max_SVs;i++) {
//        series_data[i]=new Array()
        options.series[i]= {name: 'SV: ' + (i+1),
                            data: new Array()}
        last_slip[i]=-1
        last_Az[i]=-9
        last_Elev[i]=-19
        last_Every[i]=1
        }

    File_Name=antennaFilePrefix(plotAntennas, plotAntenna) + System + "-" + Freq + "-" + Signal +".SNR";
    $("#status").text("Loading data from server")

    loadBandSnr(plotAntennas, plotAntenna, System, Freq, Signal).done(function(rows) {
        rows.forEach(function(row) {
            var current_slip = row.slip;
            var sv = row.sv - 1;
            if (!options.series[sv]) {
                return;
            }
            if ((last_slip[sv] === -1) || (last_slip[sv] === current_slip) ||
                (Math.abs(last_slip[sv] - current_slip) > 5)) {
                options.series[sv].data.push({
                    x: row.epoch,
                    y: sv + 1,
                    Elev: row.elev,
                    Az: row.az,
                    SNR: row.snr,
                });
                last_Elev[sv] = row.elev;
                last_Az[sv] = row.az;
                last_Every[sv] = 0;
                last_Every[sv]++;
            } else {
                options.series[sv].data.push({
                    x: row.epoch,
                    y: sv + 1,
                    Elev: row.elev,
                    Az: row.az,
                    SNR: row.snr,
                    marker: {
                        symbol: 'url(http://trimbletools.com/Sign-Alert-icon.png)'
                    }
                });
            }
            last_slip[sv] = current_slip;
        });

        $("#status").text("Creating Plot");
        var chart = new Highcharts.Chart(options);
        $("#status").text("");
    }).fail(function() {
        $("#status").text("Unable to load tracking data for " + System + " " + Freq + "-" + Signal + ".");
    });
  }

function appendTrackingPoint(series, row, lastSlipState) {
    var sv = row.sv - 1;
    var currentSlip = row.slip;
    var point = {
        x: row.epoch,
        y: sv + 1,
        Elev: row.elev,
        Az: row.az,
        SNR: row.snr
    };
    if (lastSlipState[sv] !== -1 && lastSlipState[sv] !== currentSlip &&
        Math.abs(lastSlipState[sv] - currentSlip) <= 5) {
        point.marker = {
            symbol: 'url(http://trimbletools.com/Sign-Alert-icon.png)'
        };
    }
    series.data.push(point);
    lastSlipState[sv] = currentSlip;
}

function create_compare_plot(System, Freq, Signal) {
    var limits = trackingLimits(System);
    var options = interactiveChartOptions({
        chart: {
            renderTo: 'container',
            type: 'scatter',
            animation: false
        },
        legend: { enabled: true },
        title: {
            text: 'Tracking Compare (' + System + ' ' + Freq + '-' + Signal + ')'
        },
        xAxis: {
            type: 'datetime',
            title: { text: 'GPS Time' }
        },
        yAxis: {
            min: limits.min,
            max: limits.max,
            endOnTick: false,
            title: { text: 'SV' }
        },
        tooltip: {
            formatter: function() {
                return '<b>' + this.series.name + '</b><br/>' +
                    'Elev: ' + this.point.Elev + ' Az: ' + this.point.Az + ' SNR: ' + this.point.SNR;
            }
        },
        plotOptions: {
            series: { turboThreshold: 0 },
            scatter: {
                marker: { radius: 1 }
            }
        },
        series: []
    });

    var antIds = compareAntennaIds(plotAntennas);
    antIds.forEach(function(antId) {
        options.series.push({
            name: antennaLabel(antId),
            color: antennaColor(antId),
            data: []
        });
    });

    var requests = antIds.map(function(antId, index) {
        return loadBandSnr(plotAntennas, antId, System, Freq, Signal).then(function(rows) {
            return { index: index, rows: rows };
        });
    });

    $("#status").text("Loading compare data");
    whenAll(requests).done(function(results) {
        results.forEach(function(result) {
            var lastSlip = [];
            for (var i = 0; i < limits.max; i++) {
                lastSlip[i] = -1;
            }
            result.rows.forEach(function(row) {
                appendTrackingPoint(options.series[result.index], row, lastSlip);
            });
        });
        $("#status").text("Creating Plot");
        new Highcharts.Chart(options);
        $("#status").text("");
    }).fail(function() {
        $("#status").text("Unable to load compare tracking data.");
    });
}

</script>
