<script>
var GAL_E6_SIGNALS = ["E6_D", "E6_PD", "E6_P", "BPSK_PD"];
var BDS_B2B_SIGNALS = ["BPSK_D", "I"];
var trackedSignalsByBand = {};

function recordTrackedSignal(bandClass) {
    var parts = bandClass.split("-");
    if (parts.length < 3) {
        return;
    }
    var key = parts[0] + "-" + parts[1];
    var signal = parts.slice(2).join("-");
    if (!trackedSignalsByBand[key]) {
        trackedSignalsByBand[key] = [];
    }
    if (trackedSignalsByBand[key].indexOf(signal) === -1) {
        trackedSignalsByBand[key].push(signal);
    }
}

function firstTrackedSignal(system, freq, fallbacks) {
    var found = trackedSignalsByBand[system + "-" + freq] || [];
    for (var i = 0; i < fallbacks.length; i++) {
        if (found.indexOf(fallbacks[i]) !== -1) {
            return fallbacks[i];
        }
    }
    return fallbacks[0];
}

function create_plot_tracked(system, freq, fallbacks) {
    create_plot(system, freq, firstTrackedSignal(system, freq, fallbacks));
}

function navigate_plot_tracked(page, system, freq, fallbacks) {
    var signal = firstTrackedSignal(system, freq, fallbacks);
    navigatePlot(page + "?SYSTEM=" + system + "&FREQ=" + freq + "&SIGNAL=" + signal);
}

function create_gal_e6_plot() {
    create_plot_tracked("GAL", "E6", GAL_E6_SIGNALS);
}

function navigate_gal_e6(page) {
    navigate_plot_tracked(page, "GAL", "E6", GAL_E6_SIGNALS);
}

function create_bds_b2b_plot() {
    create_plot_tracked("BDS", "E5B", BDS_B2B_SIGNALS);
}

function navigate_bds_b2b(page) {
    navigate_plot_tracked(page, "BDS", "E5B", BDS_B2B_SIGNALS);
}

function create_Buttons(PLOT, antennas, selectedAntenna) {
   if (!antennas) {
       antennas = trackedAntennas;
   }
   if (selectedAntenna === undefined || selectedAntenna === null) {
       selectedAntenna = trackedAntennas[0];
   }

   $("#"+PLOT).removeProp("hidden")

    File_Name="Tracked.Bands";
    var prefix = antennaFilePrefix(antennas, selectedAntenna);
    $.get(File_Name, function(data) {
        var lines = data.split('\n');

        $.each(lines, function(lineNo, line) {
            if (!line) {
                return;
            }
            if (!trackedLineMatchesAntenna(line, antennas, selectedAntenna)) {
                return;
            }
            var bandClass = bandBaseName(line, prefix);
            recordTrackedSignal(bandClass);
            Buttons=$("."+bandClass)
            for (var i = 0; i < Buttons.length; i++) {
                Buttons[i].disabled=false
            }
        })
    })
}

</script>
