<script>
function create_Buttons(PLOT, antennas, selectedAntenna) {
   if (!antennas) {
       antennas = trackedAntennas;
   }
   if (selectedAntenna === undefined || selectedAntenna === null) {
       selectedAntenna = trackedAntennas[0];
   }

   $("#"+PLOT).removeProp("hidden")

    File_Name="Tracked.Bands";
    var prefix = antennaFilePrefix(antennas, selectedAntenna);
    $.get(File_Name, function(data) {
        var lines = data.split('\n');

        $.each(lines, function(lineNo, line) {
            if (!line) {
                return;
            }
            if (!trackedLineMatchesAntenna(line, antennas, selectedAntenna)) {
                return;
            }
            var bandClass = bandBaseName(line, prefix);
            Buttons=$("."+bandClass)
            for (var i = 0; i < Buttons.length; i++) {
                Buttons[i].disabled=false
            }
        })
    })
}

</script>
