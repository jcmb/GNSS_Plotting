<script>

var Max_Bands = 1;
var System;
var Sv;
var plotAntennas = ["0"];
var plotAntenna = "0";
var plotCompareMode = false;

function create_plot(System,SV,Mode) {
    if (plotCompareMode && isTripleAntennaLayout(plotAntennas)) {
        create_compare_plot(System, SV, Mode);
        return;
    }


    if (System == "GPS") {
        Max_Bands=4;
        }

    if (System == "GLONASS") {
        Max_Bands=3;
        }

    if (System == "SBAS") {
        Max_Bands=2;
        }

    var options = interactiveChartOptions({
        chart: {
            renderTo: 'container',
            type: 'line',
            markersize: 1,
        },

        legend: {
            enabled: true
        },
        title: {
            text: 'Tracking Info (' + System +  ': ' + SV + ')'
            },

        xAxis : {
            type: 'datetime',
            title: {
                text: 'Time'
            }
        },
        yAxis: [
            {
            min:0,
//            max:Max_Bands,
            endOnTick:false,
            labels: {
                enabled: false
                },
            title: {
                text: 'Signal'
                },
            },
            {
            min:0,
            max:89,
            startOnTick:true,
            endOnTick:true,
            tickInterval : 15,
            labels: {
                enabled: true
                },
            opposite: true,
            title: {
                text: 'Elevation'
                },
           }
           ],
        tooltip: {
            formatter: function() {
//                console.log(this)
                
                if (this.point.Az) {
                   return '<b>'+ this.series.name +'</b><br/>'
                   +' Az: ' +this.point.Az +' SNR: ' +this.point.SNR;
                   }
                else {
                   return '<b>'+ this.series.name +': </b>' +this.point.y;

                    } 
                }
        },
        plotOptions: {
            series: {
                turboThreshold: 0
                },
            scatter: {
                marker: {
                    radius: 2,
                    states: {
                        hover: {
                            enabled: true,
                            lineColor: 'rgb(100,100,100)'
                        }
                    }
                },
                states: {
                    hover: {
                        marker: {
                            enabled: false
                        }
                    }
                },
            }
        },

        });

    series_data=[];
    elev_data=[];
    options.series=[]
    last_slip=[]

    if (Mode=="SIGNAL") {		         
       options.yAxis[0].max=Max_Bands
       options.yAxis[0].name="Signal"
       }
    else {
       options.yAxis[0].title.text="SNR"
       options.yAxis[0].labels.enabled=true
       }
    for (var i=1;i<=Max_Bands;i++) {
        series_data[i]=new Array()
        options.series[i-1]= {name: 'Band: ' + (i)}
        last_slip[i]=-1
        }

    series_data[0]=new Array() //Elevation
    options.series[Max_Bands] = {
	name: "Elevation",
        yAxis: 1,
        marker: { enabled: false},
        }

    if (System == "GPS") {
        options.series[0] = {name:  "L1 C/A"}
        options.series[1] = {name:  "L2 E"}
        options.series[2] = {name:  "L2 CS"}
        options.series[3] = {name:  "L5 IQ"}
        }

    File_Name=antennaFilePrefix(plotAntennas, plotAntenna) + System + "-" + SV +".SNR-SV";
    console.log(File_Name)

    $.get(File_Name, function(data) {
        // Split the lines
        var lines = data.split('\n');

        // Iterate over the lines and add categories or series
        $.each(lines, function(lineNo, line) {
            var items = line.split(',');

            if (items[0]) {
                for (var i=1;i<=Max_Bands;i++) {
                    if (items[2+(i*2)]) {
//                        console.log("Have Data")
                        current_slip=parseInt(items[2+(i*2)])
//                        console.log(items[1])					       
	    	         elev_data.push({
                             x:items[0],
                             y:parseFloat(items[1]),
//                             Az: items[3],
//                             SNR: parseInt(items[3]),
                             })
                        if ((last_slip[i]==-1) || (last_slip[i]==current_slip)) {
	 	            if (Mode=="SIGNAL") {		       
                               series_data[i].push({
                                   x:items[0],
                                   y:i,
//                                Elev: items[1],
                                   Az: items[2],
                                   Signal:i,
                                   SNR: parseInt(items[1+(i*2)]),
                                  });
                               }
                            else {
                               series_data[i].push({
                                   x:items[0],
                                   y:parseInt(items[1+(i*2)]),
//                                Elev: items[1],
                                   Az: items[2],
                                   Signal:i,
                                  });
                               }
                            }
                         else {
	 	            if (Mode=="SIGNAL") {		       
                               series_data[i].push({
                                   x:items[0],
                                   y:i,
//                                Elev: items[1],
                                   Az: items[2],
                                Signal: i,
                                SNR: parseInt(items[1+(i*2)]),
                                marker: {
                                    symbol: 'url(/images/Sign-Alert-icon.png)'
                                    }
                                })
                                }   
                            else {
                               series_data[i].push({
                                   x:items[0],
                                   y:parseInt(items[1+(i*2)]),
//                                Elev: items[1],
                                   Az: items[2],
                                   Signal:i,
                                   marker: {
                                      symbol: 'url(/images/sun.png)'
                                }
                                  });
		              }
                        }
                    last_slip[i]=current_slip
                    }
                    else {
//                        console.log("Have Missing")
			elev_data.push({
                                x:items[0],
                                y:null,
		                })

                        series_data[i].push({
                            x:items[0],
                            y: null,
//                            Elev: items[1],
                            Az: items[2],
                            SNR: null,
                            Signal:i,
                        });
                    }
                }
            }});

        // Create the chart. It has to be done here as it is made on the call back

        for (var i=1;i<=Max_Bands;i++) {
            console.log(i)
//            console.log(series_data[i])
            options.series[i-1].data=series_data[i]
            }
        options.series[Max_Bands].data=elev_data

        var chart = new Highcharts.Chart(options);
        console.log(options)
        });
    }

function create_compare_plot(System, SV, Mode) {
    if (System == "GPS") {
        Max_Bands = 4;
    } else if (System == "GLONASS") {
        Max_Bands = 3;
    } else if (System == "SBAS") {
        Max_Bands = 2;
    } else {
        Max_Bands = 2;
    }

    var bandNames = bandNamesForSystem(System, Max_Bands);
    var options = interactiveChartOptions({
        chart: {
            renderTo: 'container',
            type: 'line'
        },
        legend: { enabled: true },
        title: {
            text: 'SV Compare (' + System + ': ' + SV + ')'
        },
        xAxis: {
            type: 'datetime',
            title: { text: 'Time' }
        },
        yAxis: [
            {
                endOnTick: false,
                title: { text: Mode === "SIGNAL" ? 'Signal' : 'SNR' }
            },
            {
                min: 0,
                max: 89,
                tickInterval: 15,
                opposite: true,
                title: { text: 'Elevation' }
            }
        ],
        plotOptions: {
            series: { turboThreshold: 0 }
        },
        series: []
    });

    var antIds = compareAntennaIds(plotAntennas);
    antIds.forEach(function(antId) {
        for (var band = 1; band <= Max_Bands; band++) {
            options.series.push({
                name: antennaLabel(antId) + ' ' + (bandNames[band - 1] || ('Band ' + band)),
                color: antennaColor(antId),
                data: [],
                yAxis: 0
            });
        }
        options.series.push({
            name: antennaLabel(antId) + ' Elevation',
            color: antennaColor(antId),
            dashStyle: 'ShortDot',
            marker: { enabled: false },
            data: [],
            yAxis: 1,
            showInLegend: false
        });
    });

    var requests = antIds.map(function(antId, antIndex) {
        return loadSvSnr(plotAntennas, antId, System, SV, Max_Bands).then(function(rows) {
            return { antIndex: antIndex, rows: rows };
        });
    });

    whenAll(requests).done(function(results) {
        results.forEach(function(result) {
            var elevSeriesIndex = (result.antIndex * (Max_Bands + 1)) + Max_Bands;
            var lastSlip = [];
            for (var i = 1; i <= Max_Bands; i++) {
                lastSlip[i] = -1;
            }
            result.rows.forEach(function(row) {
                options.series[elevSeriesIndex].data.push({
                    x: row.epoch,
                    y: row.elev
                });
                for (var band = 1; band <= Max_Bands; band++) {
                    var seriesIndex = (result.antIndex * (Max_Bands + 1)) + (band - 1);
                    var bandData = row.bands[band - 1];
                    if (!bandData || bandData.snr === null) {
                        options.series[seriesIndex].data.push({ x: row.epoch, y: null });
                        continue;
                    }
                    var currentSlip = bandData.slip;
                    var point = {
                        x: row.epoch,
                        y: Mode === "SIGNAL" ? band : bandData.snr,
                        Az: row.az,
                        SNR: bandData.snr
                    };
                    if (lastSlip[band] !== -1 && lastSlip[band] !== currentSlip) {
                        point.marker = {
                            symbol: 'url(/images/Sign-Alert-icon.png)'
                        };
                    }
                    options.series[seriesIndex].data.push(point);
                    lastSlip[band] = currentSlip;
                }
            });
        });
        new Highcharts.Chart(options);
    }).fail(function() {
        $("#container").text("Unable to load compare SV SNR data.");
    });
}

initAntennaPage("antenna-selector", function(antennas, antenna, compareMode) {
    plotAntennas = antennas;
    plotAntenna = antenna;
    plotCompareMode = compareMode;

    System=getURLParameter("SYSTEM")
    Sv=getURLParameter("SV")

    if ( System == "null")  {
        System="GPS"
        }

    if ( Sv == "null")  {
        Sv="1"
        }

    create_plot(System,Sv,"SNR")
});


function update_plot(Value) {
    console.log("Update Plot to " + Value)
    create_plot(System,Sv,Value)
    }


</script>

<button type="button" class="SNR" onclick="update_plot('SNR')" > Display SNR </button>
