if [ `uname` = "Darwin" ]
then
   GNSS_RAW_BASE_DIR=/Volumes/GPS_MYSQL/GPS_Data
   GNSS_24_BASE_DIR=/Volumes/GPS_No_Backup/GPS_Data_24_Hour

elif  [ `uname` = "Linux" ]
then
   GNSS_RAW_BASE_DIR=/mnt/GPS_Admin/GNSS_Data
   GNSS_24_BASE_DIR=/mnt/GNSS_No_Backup/GNSS_Data_24_Hour
else
  echo "Can not determine OS"
  logger "GNSS_PAth.cfg, can not determine OS"
  exit 200
fi

