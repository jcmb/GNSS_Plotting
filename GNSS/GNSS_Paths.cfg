if [ `uname` = "Darwin" ]
then
   GNSS_RAW_BASE_DIR=/Volumes/GPS_MYSQL/GPS_Data
   GNSS_24_BASE_DIR=/Volumes/GPS_No_Backup/GPS_Data_24_Hour
   GNSS_BACKUP_MOUNT=/Volumes/GPS_Admin_Backup
   GNSS_BACKUP2_MOUNT=/Volumes/GNSS_Non_Base_Backup
   ROBBIE_HTML=/Volumes/GPS_Admin/html/Robbie.html
   GNSS_RESULTS_DIR=/Volumes/Results

elif  [ `uname` = "Linux" ]
then
   GNSS_RAW_BASE_DIR=/mnt/GPS_Admin/GNSS_Data
   GNSS_24_BASE_DIR=/mnt/GNSS_No_Backup/GNSS_Data_24_Hour
   GNSS_BACKUP_MOUNT=/mnt/GPS_Admin_Backup
   GNSS_BACKUP2_MOUNT=/mnt/GNSS_Non_Base_Backup
   ROBBIE_HTML=/mnt/GPS_Admin/html/Robbie.html
   GNSS_RESULTS_DIR=/mnt/Data/results
else
  echo "Can not determine OS"
  logger "GNSS_PAth.cfg, can not determine OS"
  exit 200
fi

